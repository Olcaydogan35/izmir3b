<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Şehrimiz İzmir | 3B Galeri</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071521;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
body{touch-action:none}.app{width:100vw;height:100vh;min-height:560px;background:radial-gradient(circle at 45% 40%,#12354a 0,#0a2232 36%,#06141f 72%);display:grid;grid-template-columns:280px minmax(0,1fr) 420px;grid-template-rows:92px 1fr 70px;position:relative}
header{grid-column:1/4;display:flex;align-items:center;padding:0 34px;border-bottom:1px solid #ffffff20;background:#06131dcc;backdrop-filter:blur(10px);z-index:5}.brand h1{margin:0;font-size:27px;letter-spacing:.5px}.brand p{margin:5px 0 0;color:#a9c5d5;font-size:14px}.accent{color:#f1b95c}
.sidebar{padding:24px 18px;border-right:1px solid #ffffff18;background:#071722a8;overflow:auto}.sidebar h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#87aabd;margin:0 8px 16px}.card{display:flex;gap:12px;align-items:center;width:100%;padding:11px;margin-bottom:12px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;transition:.2s}.card:hover,.card.active{transform:translateX(4px);border-color:#e7b05eaa;background:#e7b05e14;box-shadow:0 8px 30px #0004}.thumb{width:78px;height:78px;border-radius:12px;background:linear-gradient(145deg,#183c4d,#0b1d28);display:grid;place-items:center;overflow:hidden}.thumb model-viewer{width:100%;height:100%;pointer-events:none}.card strong{display:block;font-size:17px}.card span{display:block;color:#9db8c7;font-size:12px;margin-top:5px;line-height:1.35}
.viewer{position:relative;min-width:0;overflow:hidden}.viewer::before{content:"";position:absolute;inset:0;background:url("siluet.png") center bottom/cover no-repeat;opacity:.16;pointer-events:none}.viewer model-viewer{position:relative;z-index:1;width:100%;height:100%;background:transparent;--poster-color:transparent}.hint{position:absolute;z-index:2;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 15px;border:1px solid #ffffff20;border-radius:999px;background:#06131dbd;color:#c7d9e2;font-size:13px;pointer-events:none;white-space:nowrap}.info{padding:30px 30px 24px;border-left:1px solid #ffffff18;background:#071722d9;overflow:auto}.kicker{color:#e7b05e;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700}.info h2{font-size:34px;margin:8px 0 5px}.life{color:#8fb0c0;margin-bottom:22px}.info p{font-size:15px;line-height:1.68;color:#d5e2e8}.facts{margin:20px 0 0;padding:0;list-style:none}.facts li{padding:14px 0;border-top:1px solid #ffffff14;font-size:14px;line-height:1.55;color:#c9d9e1}.facts b{color:#fff}.badge{display:inline-block;margin-top:20px;padding:8px 11px;border-radius:8px;background:#e7b05e17;border:1px solid #e7b05e50;color:#f1c87e;font-size:12px}
.fullscreen-exit{display:none;position:absolute;z-index:3;top:12px;right:12px;border:1px solid #ffffff55;border-radius:10px;background:#06131ddd;color:#fff;padding:10px 14px;cursor:pointer}.viewer:fullscreen,.viewer.expanded{width:100vw!important;height:100dvh!important;min-height:0!important;background:#071521}.viewer:fullscreen .fullscreen-exit,.viewer.expanded .fullscreen-exit{display:block}.viewer.expanded{position:fixed;inset:0;z-index:100}
.fullscreen-title,.fullscreen-toolbar,.fullscreen-panel{display:none;position:absolute;z-index:3}.viewer:fullscreen .fullscreen-title,.viewer.expanded .fullscreen-title{display:block;top:15px;left:15px;max-width:calc(100% - 180px);padding:9px 12px;border-radius:10px;background:#06131ddd;font-weight:700}.viewer:fullscreen .fullscreen-toolbar,.viewer.expanded .fullscreen-toolbar{display:flex;left:12px;right:12px;bottom:12px;gap:8px;justify-content:center}.fullscreen-toolbar button{flex:1;max-width:180px;min-height:42px;border:1px solid #ffffff55;border-radius:10px;background:#06131ddd;color:#fff;font-size:14px;cursor:pointer}.viewer:fullscreen .hint,.viewer.expanded .hint{display:none}.viewer:fullscreen .fullscreen-panel.open,.viewer.expanded .fullscreen-panel.open{display:block;top:68px;right:12px;bottom:66px;width:min(420px,calc(100% - 24px));overflow:auto;padding:18px;border:1px solid #ffffff35;border-radius:14px;background:#071722f2;box-shadow:0 12px 40px #0008}.fullscreen-panel h2{font-size:24px;margin:0 0 6px}.fullscreen-panel p,.fullscreen-panel li{font-size:14px;line-height:1.55;color:#d5e2e8}.fullscreen-panel ul{padding-left:18px}.fullscreen-panel li{margin-bottom:12px}.fullscreen-panel .life{margin-bottom:12px}
footer{grid-column:1/4;border-top:1px solid #ffffff18;background:#06131dcc;display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:#8faab9;font-size:12px}.controls{display:flex;gap:8px}.controls button{border:1px solid #ffffff20;background:#ffffff0b;color:#dce8ed;border-radius:10px;padding:8px 12px;cursor:pointer}.controls button:hover{background:#ffffff16}
@media(max-width:1050px){.app{grid-template-columns:180px minmax(0,1fr) 320px}.info{padding:20px}.info h2{font-size:27px}.thumb{width:58px;height:58px}.card strong{font-size:14px}}
@media(max-width:1200px) and (pointer:coarse), (max-width:760px){
 html,body{height:auto;min-height:100%;overflow:auto}
 body{touch-action:auto}
 .app{width:100%;height:auto;min-height:100dvh;display:flex;flex-direction:column}
 header{flex:none;min-height:64px;padding:8px 16px}.brand h1{font-size:21px}.brand p{display:block;font-size:11px;margin-top:2px}
 .sidebar{flex:none;display:flex;gap:8px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:9px 12px;border-right:0;border-bottom:1px solid #ffffff18;scrollbar-width:thin}
 .sidebar h2{display:none}.card{flex:0 0 auto;width:auto;min-width:135px;max-width:190px;min-height:68px;padding:7px;gap:8px;margin:0;border-radius:12px}.card:hover,.card.active{transform:none}.thumb{flex:none;width:50px;height:50px}.card strong{font-size:13px}.card span{display:none}
 .viewer{flex:none;width:100%;height:max(300px,calc(100dvh - 198px));min-height:300px}
 .hint{bottom:10px;font-size:11px;padding:6px 10px;max-width:calc(100% - 20px);white-space:normal;text-align:center}
 footer{order:1;flex:none;min-height:54px;padding:7px 12px;justify-content:center}footer>span{display:none}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}.controls button{min-width:0;min-height:38px;padding:8px 4px;font-size:12px;line-height:1.2;white-space:nowrap}
 .info{order:2;flex:auto;overflow:visible;padding:20px 18px 32px;border-left:0;border-top:1px solid #ffffff18}.info h2{font-size:26px}.info p{font-size:14px}.facts li{font-size:13px}
}
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
<div class="app">
<header><div class="brand"><h1>Şehrimiz <span class="accent">İzmir</span></h1><p>3B Galeri • İzmir’in tarihi yapıları, simgeleri ve önemli şahsiyetleri</p></div></header>
<aside class="sidebar"><h2>3B Eserler</h2>
<button class="card active" data-id="caka"><div class="thumb"><model-viewer src="models/cakabey.glb" camera-orbit="25deg 75deg auto" disable-zoom></model-viewer></div><div><strong>Çaka Bey</strong><span>İlk Türk amirali ve denizcisi</span></div></button>
<button class="card" data-id="umur"><div class="thumb"><model-viewer src="models/gaziumurbey.glb" camera-orbit="25deg 75deg auto" disable-zoom></model-viewer></div><div><strong>Gazi Umur Bey</strong><span>Aydınoğulları'nın denizci hükümdarı</span></div></button>
<button class="card" data-id="saat"><div class="thumb"><model-viewer src="models/saatkule-v3.glb" camera-orbit="25deg 75deg auto" disable-zoom></model-viewer></div><div><strong>İzmir Saat Kulesi</strong><span>Konak Meydanı'nın simgesi</span></div></button>
<button class="card" data-id="kiyafet"><div class="thumb"><model-viewer src="models/kiyafet.glb" camera-orbit="25deg 75deg auto" disable-zoom></model-viewer></div><div><strong>İzmir Yöresel Kıyafetleri</strong><span>Zeybek kültürü ve Ege'nin giyim mirası</span></div></button>
</aside>
<main class="viewer"><model-viewer id="hero" src="models/cakabey.glb" alt="Çaka Bey 3B modeli" camera-controls touch-action="pan-y" interaction-prompt="none" shadow-intensity="1.2" shadow-softness=".8" environment-image="neutral" exposure="1.05" min-camera-orbit="auto 20deg 70%" max-camera-orbit="auto 160deg 160%" camera-orbit="25deg 75deg 105%"></model-viewer><div class="hint">Sürükle: döndür • Tekerlek / iki parmak: yakınlaştır</div><div class="fullscreen-title" id="fullscreen-title"></div><button class="fullscreen-exit" id="fullscreen-exit" type="button">Tam ekrandan çık</button><div class="fullscreen-panel" id="fullscreen-panel"><h2 id="fullscreen-name"></h2><div class="life" id="fullscreen-life"></div><p id="fullscreen-summary"></p><ul id="fullscreen-facts"></ul></div><div class="fullscreen-toolbar"><button id="previous" type="button">‹ Önceki</button><button id="fullscreen-info" type="button" aria-expanded="false" aria-controls="fullscreen-panel">Bilgi</button><button id="next" type="button">Sonraki ›</button></div></main>
<section class="info"><div class="kicker" id="kicker">Denizcilik Tarihi</div><h2 id="name">Çaka Bey</h2><div class="life" id="life">11. yüzyıl — ö. 1092</div><p id="summary"></p><ul class="facts" id="facts"></ul><div class="badge" id="badge"></div></section>
<footer><span>1920 × 1080 sergi arayüzü • Mouse ve dokunmatik uyumlu</span><div class="controls"><button id="reset" type="button" aria-label="Görünümü sıfırla">Sıfırla</button><button id="rotate" type="button" aria-label="Otomatik döndür">Döndür</button><button id="fullscreen" type="button">Tam ekran</button></div></footer>
</div>
<script>
const data={
 caka:{name:'Çaka Bey',life:'11. yüzyıl — ö. 1092',model:'models/cakabey.glb',summary:'Çaka Bey, tarihteki ilk Türk amirali ve denizcisi olarak kabul edilen; 11. yüzyılda İzmir ve çevresinde bağımsız bir beylik kurmuş Türk komutanıdır.',facts:[['İlk Türk Donanması','Malazgirt Zaferi sonrasında Anadolu’ya gelen Çaka Bey, 1081’de İzmir’de kurduğu tersanede gemiler inşa ettirerek Türk denizcilik tarihinin ilk donanma teşkilatlanmalarından birini oluşturdu.'],['Doğu Roma dönemi ve yükselişi','Yaklaşık 1078’de Doğu Roma’ya esir düştü. Saray çevresinde bulunduğu dönemin ardından İzmir’e gelerek kendi siyasi hâkimiyetini kurdu.'],['Ege’deki faaliyetleri','Urla ve Foça ile Midilli, Sakız, Sisam ve Rodos gibi Ege adaları çevresinde askerî ve denizcilik faaliyetleri yürüttü; Doğu Roma kuvvetleriyle mücadele etti.']],badge:'İzmir merkezli erken Türk denizcilik tarihi'},
 umur:{name:'Aydınoğlu Gazi Umur Bey',life:'1309/1310, Ödemiş — Mart 1348, İzmir',model:'models/gaziumurbey.glb',summary:'Umur Bey, Aydınoğulları Beyliği’nin ikinci ve en tanınmış hükümdarlarından; denizcilikte büyük ün kazanmış Türk askerî lideri ve devlet adamıdır.',facts:[['Aydınoğulları Beyliği','Babası Aydınoğlu Mehmed Bey’den sonra beyliğin yönetiminde öne çıktı ve Ege kıyılarındaki siyasi ve askerî gücü geliştirdi.'],['Denizcilik faaliyetleri','İzmir merkezli güçlü bir deniz gücü oluşturarak Ege Denizi’nde seferler düzenledi ve dönemin önemli denizci beylerinden biri oldu.'],['Haçlı kuvvetleriyle mücadele','14. yüzyılda Papalık öncülüğünde oluşturulan Haçlı kuvvetleriyle mücadele etti. 1348’de İzmir’deki çatışmalar sırasında hayatını kaybetti.']],badge:'14. yüzyıl Ege Türk denizciliğinin önemli adı'},
 saat:{name:'İzmir Saat Kulesi',life:'1901 — Konak Meydanı',model:'models/saatkule-v3.glb',summary:'İzmir’in tarihi ve kültürel simgelerinden biri olan Saat Kulesi, Konak Meydanı’nda yer alan 25 metre yüksekliğinde, dört katlı bir yapıdır.',facts:[['İnşa tarihi ve amacı','Osmanlı Padişahı II. Abdülhamid’in tahta çıkışının 25. yıl dönümü anısına 1901 yılında yaptırıldı.'],['Mimari özellikleri','Raymond Charles Péré tarafından tasarlanan kule, Osmanlı ve Batı mimari etkilerini bir araya getirir. Sekizgen planlı yapının tabanında çeşmeli sebiller bulunur.'],['Saatin hikâyesi','Kulenin saati Alman İmparatoru II. Wilhelm tarafından hediye edildi.'],['Konum','Konak Meydanı’nda, Hükûmet Konağı ve Yalı Camii yakınında, Kemeraltı Çarşısı’nın girişindedir.']],badge:'Kaynak: T.C. Kültür ve Turizm Bakanlığı İzmir İl Müdürlüğü'},
 kiyafet:{name:'İzmir Yöresel Kıyafetleri',life:'Geleneksel giyim kültürü',model:'models/kiyafet.glb',summary:'İzmir’in geleneksel giyim kültürü, zeybek kültürünün ve Ege’nin tarihi dokusunun izlerini taşır. Kadın ve erkek giyiminde farklı parçalar ve süsleme biçimleri görülür.',facts:[['Erkek · Başlık','Çuha fes veya keçe külah üzerine oyalı yemeni ya da kefiye sarılır.'],['Erkek · Üst giyim','Ten gömleği ve işliğin üzerine işlemeli cepken giyilir. Kartal kanadı adıyla da bilinen camadan, cepkenin üzerine eklenen ayrı bir parçadır.'],['Erkek · Bel ve aksesuar','Kuşak ve işlemeli deri kütüklük, gündelik eşyaların ve tarihsel olarak silahların taşınmasında kullanılır.'],['Erkek · Alt giyim ve ayak','Geniş ağlı potur rahat hareket etmeyi sağlar; tozluk bacağı korur. Geleneksel ayakkabılar yemeni ve çarıktır. Körüklü çizme günümüz halk oyunu kıyafetlerinde de kullanılır.'],['Kadın · Başlık','Tepelikli fes, oyalı yazma veya ipek örtü; altın, gümüş, boncuk ve pullarla süslenebilir.'],['Kadın · Üst giyim','Bürümcük gömlek üzerine üçetek ve işlemeli cepken ya da yelek giyilir.'],['Kadın · Bel ve alt giyim','Kuşak, önlük ve arkalaç; üçeteği tamamlar. Altına geniş kesimli şalvar giyilir.'],['Kadın · Takı ve ayakkabı','Gerdanlık ve para dizileri kıyafeti tamamlar; ayakta geleneksel edik veya pabuç bulunur.']],badge:'Zeybek kıyafetleri · İzmir kültür mirası'}
};
const hero=document.querySelector('#hero'), cards=[...document.querySelectorAll('.card')], order=cards.map(c=>c.dataset.id);
let currentId='caka';
function select(id){const d=data[id];currentId=id;hero.src=d.model;hero.alt=d.name+' 3B modeli';document.querySelector('#name').textContent=d.name;document.querySelector('#life').textContent=d.life;document.querySelector('#summary').textContent=d.summary;document.querySelector('#badge').textContent=d.badge;document.querySelector('#facts').innerHTML=d.facts.map(x=>`<li><b>${x[0]}:</b> ${x[1]}</li>`).join('');document.querySelector('#fullscreen-title').textContent=d.name;document.querySelector('#fullscreen-name').textContent=d.name;document.querySelector('#fullscreen-life').textContent=d.life;document.querySelector('#fullscreen-summary').textContent=d.summary;document.querySelector('#fullscreen-facts').innerHTML=d.facts.map(x=>`<li><b>${x[0]}:</b> ${x[1]}</li>`).join('');cards.forEach(c=>c.classList.toggle('active',c.dataset.id===id));hero.cameraOrbit='25deg 75deg 105%'}
cards.forEach(c=>c.onclick=()=>select(c.dataset.id));
document.querySelector('#reset').onclick=()=>hero.cameraOrbit='25deg 75deg 105%';
let rotating=false;document.querySelector('#rotate').onclick=e=>{rotating=!rotating;hero.autoRotate=rotating;e.target.textContent=rotating?'Durdur':'Döndür';e.target.setAttribute('aria-label',rotating?'Döndürmeyi durdur':'Otomatik döndür')};
const viewer=document.querySelector('.viewer');
const fullscreenPanel=document.querySelector('#fullscreen-panel'), infoButton=document.querySelector('#fullscreen-info');
document.querySelector('#previous').onclick=()=>select(order[(order.indexOf(currentId)-1+order.length)%order.length]);
document.querySelector('#next').onclick=()=>select(order[(order.indexOf(currentId)+1)%order.length]);
infoButton.onclick=()=>{const open=fullscreenPanel.classList.toggle('open');infoButton.textContent=open?'Bilgiyi kapat':'Bilgi';infoButton.setAttribute('aria-expanded',String(open))};
document.querySelector('#fullscreen').onclick=async()=>{try{if(viewer.requestFullscreen)await viewer.requestFullscreen();else viewer.classList.add('expanded')}catch{viewer.classList.add('expanded')}};
document.querySelector('#fullscreen-exit').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();viewer.classList.remove('expanded');fullscreenPanel.classList.remove('open');infoButton.textContent='Bilgi';infoButton.setAttribute('aria-expanded','false')};
select('caka');
</script>
</body></html>
